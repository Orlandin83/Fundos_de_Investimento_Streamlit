name: Atualizar base de fundos

on:
  schedule:
    - cron: "30 20 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-base-fundos
  cancel-in-progress: false

jobs:
  atualizar:
    name: Coletar cotas e publicar banco
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Atualizar a base da CVM
        run: python cnpj.py --meses-reprocessar 2

      - name: Executar os testes
        run: python -m unittest discover -s tests -v

      - name: Publicar a base atualizada
        shell: bash
        run: |
          if git diff --quiet -- dados/fundos.duckdb; then
            echo "A base nao sofreu alteracoes. Nenhum commit sera criado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/fundos.duckdb
          git commit -m "Atualizacao automatica da base de fundos"
          git push
