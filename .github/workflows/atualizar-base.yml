name: Atualizar base de fundos

on:
  schedule:
    - cron: "30 20 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizacao-base-fundos
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar cotas no PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configurar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Verificar configuração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'Configure o Secret DATABASE_URL'"

      - name: Instalar dependencias
        run: uv sync --locked --python 3.13

      - name: Executar os testes
        run: uv run --locked --python 3.13 python -m unittest discover -s tests -v

      - name: Atualizar a base da CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked --python 3.13 python cnpj.py --meses-reprocessar 2

      - name: Atualizar CDI e Ibovespa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked --python 3.13 python benchmarks.py --dias-reprocessar 10
