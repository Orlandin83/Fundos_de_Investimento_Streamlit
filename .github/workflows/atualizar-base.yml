name: Atualizar base de fundos

on:
  schedule:
    - cron: "30 20 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizacao-base-fundos
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar cotas no PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verificar configuração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'Configure o Secret DATABASE_URL'"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Executar os testes
        run: python -m unittest discover -s tests -v

      - name: Atualizar a base da CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cnpj.py --meses-reprocessar 2
