name: Testes PostgreSQL
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fundos_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/fundos_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Verificar requirements.txt
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - run: uv run --locked --python "${{ matrix.python-version }}" python -m unittest discover -s tests -v
